name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Third-party actions are pinned to commit SHAs, not tags. Tags are mutable —
  # a compromised action repo could repoint a version tag at anything. Dependabot
  # updates these (see .github/dependabot.yml), rewriting SHA and comment together.
  CHECKOV_VERSION: "3.3.9"

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: shellcheck
        # Preinstalled on ubuntu-latest, so no action dependency needed.
        # Fails on warning and above; the repo's remaining findings are all
        # informational and triaged in docs/code_review.md.
        run: shellcheck --severity=warning scripts/*.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Layout, links and anchors
        # Enforces the project convention that all markdown lives in docs/
        # except README.md and Claude.md, and that every relative link and
        # #anchor resolves.
        run: python3 scripts/check-docs.py

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.0"
          terraform_wrapper: false

      - name: Format
        run: terraform -chdir=terraform fmt -check -recursive -diff

      - name: Init
        # -backend=false: validation needs no state and no credentials.
        run: terraform -chdir=terraform init -backend=false

      - name: Validate
        run: terraform -chdir=terraform validate

      - name: Role mode evaluates
        # `validate` is mode-agnostic. This exercises the role branch's variable
        # validation and locals with credential-free `terraform console`.
        # It does NOT reach the lifecycle precondition — that needs a plan, which
        # needs real credentials. See TF-4 in docs/issue.md.
        run: |
          printf 'auth_method = "role"\n' > /tmp/role.tfvars
          printf 'trusted_principal_arns = ["arn:aws:iam::123456789012:user/ci"]\n' >> /tmp/role.tfvars
          echo 'local.use_role' \
            | terraform -chdir=terraform console -var-file=/tmp/role.tfvars \
            | grep -qx true

      - name: Policy JSON is valid
        run: python3 -m json.tool terraform/policies/prowler-additions-policy.json > /dev/null

  security:
    name: Terraform security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install checkov
        run: pip install --quiet "checkov==${CHECKOV_VERSION}"

      - name: Scan
        # Three findings are suppressed with inline `checkov:skip` comments and a
        # written justification in terraform/iam_user.tf. Anything NEW fails here.
        run: checkov -d terraform --compact --quiet

  stack:
    name: Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch pinned release assets
        # docker-compose.yml and .env are gitignored, so CI fetches them the same
        # way a user does. This doubles as a regression test: it fails if the
        # pinned tag's files are moved, renamed or withdrawn upstream.
        run: ./scripts/setup.sh

      - name: Compose file parses
        run: docker compose config -q

      - name: Pinned version is what we asked for
        run: |
          want=$(tr -d '[:space:]' < .prowler-version)
          echo "pinned: ${want}"
          test -s docker-compose.yml
          test -s .env

      # preflight.sh is deliberately NOT run here. It uses BSD `df -g` and would
      # silently skip the disk check on Linux — a skipped check that looks like a
      # passed one. See TOOL-3 in docs/issue.md.
