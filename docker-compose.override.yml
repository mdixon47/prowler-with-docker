# Local overrides, merged automatically by `docker compose`.
#
# This file exists because docker-compose.yml is fetched verbatim from upstream
# and is gitignored — anything edited there is lost on the next `make setup` or
# `make upgrade`. Overrides belong here instead, where they survive.

services:
  worker:
    environment:
      # Celery defaults its pool size to the CPU count. On a 12-core machine
      # that is 12 forked children, each loading the full Django app, before a
      # single scan starts. A scan then grows one child until the OOM killer
      # takes it — which is what happened on 2026-08-10 at 95% progress:
      #
      #   Process 'ForkPoolWorker-129' pid:2162 exited with 'signal 9 (SIGKILL)'
      #
      # Prowler runs one scan per provider at a time, so a wide pool buys
      # nothing here; it just reserves memory the scanning child needs.
      #
      # This exact variable is read by config/settings/celery.py:
      #   if "DJANGO_CELERY_WORKER_CONCURRENCY" in env.ENVIRON:
      #       CELERY_WORKER_CONCURRENCY = env.int("DJANGO_CELERY_WORKER_CONCURRENCY")
      # and reaches Celery via config_from_object(namespace="CELERY").
      DJANGO_CELERY_WORKER_CONCURRENCY: "4"

    # No hard mem_limit on purpose. Capping this container would make the OOM
    # arrive sooner, not later — the scanning child needs room to finish. The
    # fix is fewer children plus a larger Docker allocation.

  neo4j:
    # Heap and page cache are already trimmed to 512m each in .env. This is a
    # backstop so the JVM plus its off-heap overhead cannot creep past 2g and
    # crowd out the worker mid-scan.
    mem_limit: 2g
